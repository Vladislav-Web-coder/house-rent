# nginx для продакшена (docker/nginx/default.conf — dev-версия, проксирует на artisan serve).
# Здесь: статика отдаётся напрямую с диска, PHP обрабатывает php-fpm (сервис app:9000),
# TLS терминируется Caddy перед этим сервером (см. DEPLOY.md) — поэтому listen только 80
# и редирект на https не нужен (Caddy сам делает редирект и ставит HSTS).

# Флаг логирования: не пишем access-лог для health-check'ов
map $request_uri $loggable {
    default 1;
    "/up"   0;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 110M;

    access_log /var/log/nginx/access.log combined if=$loggable;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    # Health-check для docker/compose (Laravel route '/up')
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Отдача медиа из storage/app/public (Range-запросы nginx поддерживает по умолчанию для static files)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes always;
        sendfile on;
        tcp_nopush on;
        access_log off;
        try_files $uri =404;
    }

    # Собранные Vite-ассеты (имена содержат hash -> кэшируем надолго)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Прочая статика (css/js/изображения в public/)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Все остальные запросы — в Laravel через php-fpm
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Долгие операции в админке (загрузка видео, экспорт)
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffering on;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    # Закрыть доступ к скрытым файлам (.env, .git и т.п.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Не исполнять PHP, загруженное пользователем в media-директории
    location ~* ^/(storage|uploads)/.*\.(php|phtml)$ {
        deny all;
    }
}
