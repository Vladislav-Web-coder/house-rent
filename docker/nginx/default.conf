server {
    listen 80;
    server_name localhost;

    # Размер загружаемых файлов (для видео до 100 МБ)
    client_max_body_size 100M;

    # ОТДАЧА ВИДЕО И МЕДИА с поддержкой Range-запросов
    location /storage/ {
        # Отдаём напрямую из файловой системы
        alias /var/www/html/storage/app/public/;

        # Разрешаем Range-запросы (критично для перемотки!)
        add_header Accept-Ranges bytes always;

        # Кэширование
        expires 30d;
        add_header Cache-Control "public";

        # Эффективная отдача больших файлов
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        # Отключаем логи для статики
        access_log off;
    }

    # ОТДАЧА СТАТИКИ (CSS, JS, изображения)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp4)$ {
        root /var/www/html/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ВСЕ ОСТАЛЬНЫЕ ЗАПРОСЫ проксируем в Laravel (artisan serve)
    location / {
        proxy_pass http://laravel.test:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты для долгих запросов
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    # Скрываем скрытые файлы
    location ~ /\. {
        deny all;
    }
}
