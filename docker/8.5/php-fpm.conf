; Пул php-fpm для продакшена (Laravel + Filament + загрузка медиа до 100 МБ).
; Заменяет дефолтный пул образа php:*-fpm-alpine.
[www]
user = www-data
group = www-data

; Слушаем TCP внутри docker-сети (nginx connects to app:9000)
listen = 0.0.0.0:9000
pm = dynamic
; Для VPS 2 vCPU / 4 ГБ этого хватает с запасом на ~1000 визитов/мес.
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Долгие операции (загрузка видео, экспорт отчётов) не должны ронять воркера
request_terminate_timeout = 300s
request_slowlog_timeout = 30s
slowlog = /proc/self/fd/2

; Без вывода ошибок в тело ответа — только в stderr (логи docker)
php_admin_value[display_errors] = Off
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED
php_admin_flag[expose_php] = Off

clear_env = no
