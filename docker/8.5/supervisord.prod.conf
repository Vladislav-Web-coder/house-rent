; Supervisord для контейнера-воркера (dev-версия docker/8.5/supervisord.conf запускает artisan serve — в проде не используется).
; В compose.prod.yaml сервис `worker` монтирует ЭТОТ файл и переопределяет entrypoint на supervisord:
; здесь очереди Laravel + планировщик. Веб-часть работает на php-fpm в сервисе `app`.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:queue]
; --max-time 3600: воркер периодически перезапускается, чтобы не накапливать утечки памяти
; и подхватывать новый код после деплоя.
command=php -d memory_limit=512M /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
