# Продакшен-конфигурация (VPS 2 vCPU / 4 ГБ, трафик до ~1000 визитов/мес).
# Запуск: docker compose -f compose.prod.yaml --env-file .env up -d --build
#
# Ключевые отличия от dev-варианта compose.yaml (Sail):
#   - приложение работает на php-fpm (образ docker/8.5/Dockerfile.prod), НЕ artisan serve;
#   - наружу не проброшено НИЧЕГО, кроме nginx на 127.0.0.1:8080 — TLS терминирует
#     Caddy на хосте и проксирует на этот порт; postgres/redis доступны только
#     из внутренней сети app-net;
#   - отдельный сервис worker (queue + scheduler) вместо supervisord в web-контейнере;
#   - пароли без fallback-значений (:? ) — compose упадёт, если секрет не задан в .env;
#   - Mailpit удалён (прод использует реальный SMTP из .env);
#   - лимиты памяти/CPU, healthcheck'и, no-new-privileges, ротация docker-логов.

services:
    app:
        build:
            context: 'storage'
            dockerfile: 'docker/8.5/Dockerfile.prod'
        image: 'simbungalow/app:prod'
        restart: unless-stopped
        volumes:
            # Данные перекрывают named-тома: код лежит в слое образа, медиа — в томе.
            # После деплоя содержимое storage/app/public нужно один раз мигрировать в том
            # (см. DEPLOY.md, раздел «Первый запуск»).
            - 'app-storage:/var/www/html/storage'
            - 'app-bootstrap-cache:/var/www/html/bootstrap/cache'
        networks:
            - app-net
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'REQUEST_METHOD=GET SCRIPT_NAME=/index.php REQUEST_URI=/up QUERY_STRING= DOCUMENT_URI=/index.php DOCUMENT_ROOT=/var/www/html SERVER_NAME=localhost SERVER_ADDR=127.0.0.1 SERVER_PORT=80 REMOTE_ADDR=127.0.0.1 SERVER_PROTOCOL=HTTP/1.1 GATEWAY_INTERFACE=CGI/1.1 REDIRECT_STATUS=200 CONTENT_TYPE= CONTENT_LENGTH= PATH_INFO= PATH_TRANSLATED= cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q "Status: 200"']
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 768M
        security_opt:
            - no-new-privileges:true
        logging: &docker-logging
            driver: json-file
            options: { max-size: "10m", max-file: "5" }

    worker:
        image: 'simbungalow/app:prod'
        restart: unless-stopped
        user: root
        entrypoint: ['/usr/bin/supervisord']
        command: ['-c', '/etc/supervisor/conf.d/supervisord.conf']
        volumes:
            - 'app-storage:/var/www/html/storage'
            - 'app-bootstrap-cache:/var/www/html/bootstrap/cache'
            - './docker/8.5/supervisord.prod.conf:/etc/supervisor/conf.d/supervisord.conf:ro'
        networks:
            - app-net
        depends_on:
            app:
                condition: service_healthy
        # ffmpeg-конвертация видео грузит CPU — ограничиваем, чтобы не выложить веб
        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 1G
        security_opt:
            - no-new-privileges:true
        logging: *docker-logging

    nginx:
        image: 'nginx:1.27-alpine'
        restart: unless-stopped
        ports:
            # Единственная точка входа. Привязка к 127.0.0.1: снаружи порт НЕ слушается,
            # доступ только от Caddy на этом же хосте.
            - '127.0.0.1:8080:80'
        volumes:
            - './docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro'
            - 'app-storage:/var/www/html/storage:ro'
        networks:
            - app-net
        depends_on:
            app:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 128M
        security_opt:
            - no-new-privileges:true
        logging: *docker-logging

    pgsql:
        image: 'postgres:17-alpine'
        restart: unless-stopped
        # ПОРТЫ НАРУЖУ НЕ ПРОБРОШЕНЫ — доступ только из внутренней сети app-net
        environment:
            POSTGRES_DB: '${DB_DATABASE:?задайте DB_DATABASE в .env}'
            POSTGRES_USER: '${DB_USERNAME:?задайте DB_USERNAME в .env}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?задайте надёжный DB_PASSWORD в .env (без fallback)}'
        volumes:
            - 'pgsql-data:/var/lib/postgresql/data'
        networks:
            - app-net
        shm_size: '128mb'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 512M
        security_opt:
            - no-new-privileges:true
        logging: *docker-logging

    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        # ПОРТЫ НАРУЖУ НЕ ПРОБРОШЕНЫ
        # requirepass из REDIS_PASSWORD; AOF для сохранности сессий/очередей;
        # volatile-lru — Laravel ключи всегда пишутся с TTL (см. config/cache.php prefix).
        command: sh -c 'exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru --requirepass "$${REDIS_PASSWORD}"'
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD:?задайте надёжный REDIS_PASSWORD в .env}'
        volumes:
            - 'redis-data:/data'
        networks:
            - app-net
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 320M
        security_opt:
            - no-new-privileges:true
        logging: *docker-logging

networks:
    app-net:
        driver: bridge

volumes:
    pgsql-data:
    redis-data:
    app-storage:
    app-bootstrap-cache:
